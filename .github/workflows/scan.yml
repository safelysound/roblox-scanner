name: Roblox Group Scan

# Public repo - free minutes unlimited
# Secrets: DISCORD_WEBHOOK (optional) - webhook URL for auto-editing embed

on:
  workflow_dispatch:
    inputs:
      max_members:
        description: 'Limit members for testing (leave empty for all 2771)'
        required: false
        default: ''
      place_id:
        description: 'Target PlaceId'
        required: false
        default: '74205509034203'
      group_id:
        description: 'Group ID'
        required: false
        default: '1200769'
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes - auto-updates Discord embed by editing same message
  # push:
  #   branches: [main]

# Prevent overlapping runs from editing same Discord message at same time
concurrency:
  group: roblox-scan
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit discord_message_id.txt for persistence across runs

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests tqdm
          python --version

      - name: Run shard ${{ matrix.shard }}/3
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          ROBLOSECURITY_1: ${{ secrets.ROBLOSECURITY_1 }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          echo "Running shard ${{ matrix.shard }} of 3"
          MAX_ARGS=""
          if [ -n "${{ inputs.max_members }}" ]; then
            MAX_ARGS="--max-members ${{ inputs.max_members }}"
          fi
          python roblox_group_scanner.py \
            --group-id "${{ inputs.group_id || '1200769' }}" \
            --place-id "${{ inputs.place_id || '74205509034203' }}" \
            --shard ${{ matrix.shard }} --shards 3 \
            $MAX_ARGS \
            --json shard_${{ matrix.shard }}.json \
            --verbose
          echo "Shard ${{ matrix.shard }} produced:"
          ls -lh shard_${{ matrix.shard }}.json
          cat shard_${{ matrix.shard }}.json | head -c 1000

      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  merge:
    needs: scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          path: shards

      - name: Debug shards
        run: |
          echo "=== Current dir ==="
          ls -R | head -n 100
          echo "=== Shards dir ==="
          ls -lh shards/ || echo "shards/ not found"
          find . -name "shard_*.json" | head -n 20
          find shards -type f 2>&1 | head -n 20

      - name: Merge shards
        id: merge
        run: |
          SHARDS=$(find shards . -name "shard_*.json" 2>/dev/null | tr '\n' ' ')
          echo "Found shards: $SHARDS"
          if [ -z "$SHARDS" ]; then
            echo "ERROR: No shard files found!"
            find . -type f -name "*.json" | head -n 20
            exit 1
          fi
          python merge_shards.py $SHARDS --json roblox_scan_results.json --csv roblox_scan_results.csv
          ls -lh roblox_scan_results.*
          python -m json.tool roblox_scan_results.json | head -n 150

      - name: Upload final results
        uses: actions/upload-artifact@v4
        with:
          name: final-results
          path: |
            roblox_scan_results.json
            roblox_scan_results.csv
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          d=json.load(open('roblox_scan_results.json'))
          print(f\"**Group:** {d['meta']['groupId']} | **Target:** {d['meta']['targetGameName']} ({d['meta']['targetPlaceId']})\")
          print(f\"**Total members:** {d['summary']['total_members']}\")
          print(f\"**Target game:** {d['summary']['target_game_count']}\")
          print(f\"**Other games:** {d['summary']['other_game_count']}\")
          " >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts for full JSON/CSV." >> $GITHUB_STEP_SUMMARY

      - name: Restore Discord message ID
        uses: actions/cache@v4
        with:
          path: discord_message_id.txt
          key: discord-message-id
          restore-keys: |
            discord-message-id

      - name: Discord webhook (auto-edit same embed)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK secret set - skipping (set in Settings > Secrets > Actions to enable)"
            exit 0
          fi
          # Prefer repo-persisted ID over cache (cache can be stale after webhook rotation)
          if [ -f .github/discord_message_id.txt ]; then
            echo "Restoring from repo .github/discord_message_id.txt (overrides stale cache if present)"
            cp .github/discord_message_id.txt discord_message_id.txt
            echo "Using ID $(cat discord_message_id.txt)"
          elif [ -f discord_message_id.txt ]; then
            echo "Using cached ID $(cat discord_message_id.txt)"
          else
            echo "No existing message ID — will create new message"
          fi
          echo "Discord updater - editing same embed every 5 min (color 3168504, Admin Tracker)"
          python discord_updater.py roblox_scan_results.json --webhook "$DISCORD_WEBHOOK" --message-id-file discord_message_id.txt 2>&1 | head -n 100
          # Show what would be sent on dry-run for logs
          echo "--- Embed preview ---"
          python discord_updater.py roblox_scan_results.json --dry-run | head -n 80

      - name: Save Discord message ID to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: discord_message_id.txt
          key: discord-message-id-${{ hashFiles('discord_message_id.txt') }}
        continue-on-error: true

      - name: Persist Discord message ID to repo
        if: always()
        run: |
          if [ -f discord_message_id.txt ]; then
            mkdir -p .github
            cp discord_message_id.txt .github/discord_message_id.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/discord_message_id.txt || true
            git diff --staged --quiet || git commit -m "chore: update discord message id [skip ci]" || true
            git push origin HEAD:main || echo "Push failed (maybe no changes or no permission) - cache will handle it"
          else
            echo "No discord_message_id.txt to persist"
          fi
        continue-on-error: true
