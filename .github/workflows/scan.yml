name: Roblox Group Scan
# LEGACY SHIM — restored 2026-09-22 to fix cron-job.org 422 after unified refactor (trackers.yml)
# Old cron URL: POST /repos/safelysound/roblox-scanner/actions/workflows/scan.yml/dispatches
# Keep this file so that URL returns 204 instead of 422. Forwards to unified workflow.
on:
  workflow_dispatch:
    inputs:
      max_members:
        description: 'Limit members for testing (leave empty for all)'
        required: false
        default: ''
      place_id:
        description: 'Target PlaceId'
        required: false
        default: '74205509034203'
      group_id:
        description: 'Group ID'
        required: false
        default: '1200769'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  actions: write
  contents: write
jobs:
  forward:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Forward to unified tracker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          echo "Legacy scan.yml triggered (${{ github.event_name }}) — forwarding to trackers.yml tracker=admin"
          RESP=$(curl -s -w " HTTP_CODE:%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/trackers.yml/dispatches \
            -d '{"ref":"main","inputs":{"tracker":"admin","place_id":"${{ inputs.place_id }}","max_members":"${{ inputs.max_members }}"}}')
          echo "$RESP"
          echo "$RESP" | grep -q "HTTP_CODE:204" && echo "Forwarded successfully" || echo "Forward response noted"
