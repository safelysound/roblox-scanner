name: Trackers (Admin / Video Stars / Developers)

# Triggered every ~5 min by an external cron via workflow_dispatch, and on pushes to main
# (e.g. after editing config/developer_ids.txt). The job matrix is built from config/trackers.yaml.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/discord_message_id*.txt'
  workflow_dispatch:
    inputs:
      tracker:
        description: 'Which tracker to run'
        required: false
        default: 'all'
        type: choice
        options: ['all', 'admin', 'video-stars', 'developers']
      place_id:
        description: 'Target PlaceId (empty = settings.targetPlaceId from config/trackers.yaml)'
        required: false
        default: ''
      max_members:
        description: 'Limit members for testing (empty = all)'
        required: false
        default: ''
      notifier_mode:
        description: 'Developer join notifier: live (normal), test (post one sample message), dry-run (poll ~3 min, post nothing)'
        required: false
        default: 'live'
        type: choice
        options: ['live', 'test', 'dry-run']

# Least privilege by default; only the merge job needs to push (Discord message-id commits).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build the matrices from config/trackers.yaml (only the selected trackers).
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trackers: ${{ steps.plan.outputs.trackers }}
      scan: ${{ steps.plan.outputs.scan }}
      place_id: ${{ steps.plan.outputs.place_id }}
      notify: ${{ steps.plan.outputs.notify }}
    steps:
      - uses: actions/checkout@v7

      - name: Plan
        id: plan
        env:
          SELECTED: ${{ inputs.tracker }}
          INPUT_PLACE_ID: ${{ inputs.place_id }}
        run: |
          ALL=$(yq -o=json -I=0 '.trackers' config/trackers.yaml)
          if [ -n "$SELECTED" ] && [ "$SELECTED" != "all" ]; then
            TRACKERS=$(jq -c --arg s "$SELECTED" '[.[] | select(.id == $s)]' <<< "$ALL")
          else
            TRACKERS="$ALL"
          fi
          if [ "$(jq length <<< "$TRACKERS")" -eq 0 ]; then
            echo "::error::No tracker matches '$SELECTED' in config/trackers.yaml"
            exit 1
          fi
          # One scan job per (tracker, shard)
          SCAN=$(jq -c '[.[] | . as $t | ($t.shards // 1) as $n | range(0; $n) as $s | {id: $t.id, shard: $s, shards: $n}]' <<< "$TRACKERS")
          PLACE_ID="${INPUT_PLACE_ID:-$(yq '.settings.targetPlaceId' config/trackers.yaml)}"
          # Join notifiers (one per selected tracker that has a notifiers: entry)
          NOTIFY=$(yq -o=json -I=0 '(.notifiers // {}) | to_entries | map(.value + {"id": .key})' config/trackers.yaml \
                   | jq -c --argjson t "$TRACKERS" '[.[] | select(.id as $i | $t | map(.id) | index($i))]')
          {
            echo "trackers=$TRACKERS"
            echo "scan=$SCAN"
            echo "place_id=$PLACE_ID"
            echo "notify=$NOTIFY"
          } >> "$GITHUB_OUTPUT"
          echo "Trackers: $(jq -r 'map(.id) | join(", ")' <<< "$TRACKERS") | scan jobs: $(jq length <<< "$SCAN") | place: $PLACE_ID"

  # ---------------------------------------------------------------------------
  # Scan: one job per tracker shard.
  # ---------------------------------------------------------------------------
  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trackers-scan-${{ matrix.id }}-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.scan) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan ${{ matrix.id }} (shard ${{ matrix.shard }}/${{ matrix.shards }})
        env:
          TRACKER: ${{ matrix.id }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          PLACE_ID: ${{ needs.plan.outputs.place_id }}
          MAX_MEMBERS: ${{ inputs.max_members }}
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          ROBLOSECURITY_1: ${{ secrets.ROBLOSECURITY_1 }}
          ROBLOSECURITY_2: ${{ secrets.ROBLOSECURITY_2 }}
          ROBLOSECURITY_3: ${{ secrets.ROBLOSECURITY_3 }}
          ROBLOSECURITY_4: ${{ secrets.ROBLOSECURITY_4 }}
          ROBLOSECURITY_5: ${{ secrets.ROBLOSECURITY_5 }}
        run: |
          ARGS=()
          if [ -n "$MAX_MEMBERS" ]; then ARGS+=(--max-members "$MAX_MEMBERS"); fi
          OUT="shard_${TRACKER}_${SHARD}.json"
          python tracker_scanner.py --tracker "$TRACKER" --place-id "$PLACE_ID" \
            --shard "$SHARD" --shards "$SHARDS" --json "$OUT" --verbose "${ARGS[@]}"
          ls -lh "$OUT"

      - name: Upload shard
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.id }}-${{ matrix.shard }}
          path: shard_${{ matrix.id }}_${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Merge shards, update the Discord embed, remember the message id.
  # ---------------------------------------------------------------------------
  merge:
    needs: [plan, scan]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: trackers-merge-${{ matrix.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.trackers) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download shards
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: shard-${{ matrix.id }}-*
          merge-multiple: true
          path: shards

      - name: Merge shards
        env:
          ID: ${{ matrix.id }}
          EXPECTED: ${{ matrix.shards || 1 }}
          RESULTS: ${{ matrix.resultsFile }}
        run: |
          FOUND=$(find shards -name "shard_${ID}_*.json" 2>/dev/null | wc -l)
          if [ "$FOUND" -lt "$EXPECTED" ]; then
            # A partial merge would drop the missing shard's members from the embed, so keep the previous embed instead.
            echo "::warning::$ID: only $FOUND/$EXPECTED shards available - skipping merge and Discord update this run"
            exit 0
          fi
          python merge_shards.py shards/shard_"${ID}"_*.json --json "$RESULTS"

      - name: Upload merged results
        uses: actions/upload-artifact@v7
        with:
          name: final-results-${{ matrix.id }}
          path: ${{ matrix.resultsFile }}
          retention-days: 1
          if-no-files-found: ignore

      - name: Update Discord embed
        env:
          WEBHOOK: ${{ secrets[matrix.webhookSecret] }}
          RESULTS: ${{ matrix.resultsFile }}
          MSG_FILE: ${{ matrix.messageIdFile }}
          TITLE: ${{ matrix.name }}
          COLOR: ${{ matrix.color }}
          EMOJI: ${{ matrix.emoji }}
          SECRET_NAME: ${{ matrix.webhookSecret }}
        run: |
          if [ ! -f "$RESULTS" ]; then
            echo "::warning::No merged results for $TITLE, leaving the previous embed in place"
            exit 0
          fi
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Webhook secret '$SECRET_NAME' is not set, skipping Discord update for $TITLE"
            exit 0
          fi
          python discord_updater.py "$RESULTS" --webhook "$WEBHOOK" --message-id-file "$MSG_FILE" \
            --title "$TITLE" --color "$COLOR" --emoji "$EMOJI"

      # Only on main: a run on any other branch must never push to main.
      - name: Persist Discord message id
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          ID: ${{ matrix.id }}
          MSG_FILE: ${{ matrix.messageIdFile }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MSG_FILE"
          if git diff --staged --quiet; then
            echo "Message id unchanged"
            exit 0
          fi
          git commit -m "chore: update $ID message id [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "::warning::Could not push the new $ID message id; the next run will post a new message"

  # ---------------------------------------------------------------------------
  # Best-effort follow step. Bounded so a slow run can't pile up behind the next ones.
  # ---------------------------------------------------------------------------
  follow:
    needs: [plan, merge]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: trackers-follow-${{ matrix.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.trackers) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download merged results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: final-results-${{ matrix.id }}
          path: .

      - name: Follow Unknowns for ${{ matrix.id }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          TRACKER: ${{ matrix.id }}
          RESULTS: ${{ matrix.resultsFile }}
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          ROBLOSECURITY_1: ${{ secrets.ROBLOSECURITY_1 }}
          ROBLOSECURITY_2: ${{ secrets.ROBLOSECURITY_2 }}
          ROBLOSECURITY_3: ${{ secrets.ROBLOSECURITY_3 }}
          ROBLOSECURITY_4: ${{ secrets.ROBLOSECURITY_4 }}
          ROBLOSECURITY_5: ${{ secrets.ROBLOSECURITY_5 }}
        run: |
          if [ ! -f "$RESULTS" ]; then
            echo "No $RESULTS, skipping follow"
            exit 0
          fi
          # Exit code 2 = some follows failed; not fatal for the workflow
          python follow_unknown.py --tracker "$TRACKER" --json "$RESULTS"

  # ---------------------------------------------------------------------------
  # Real-time "someone joined The Hunt" notifiers (join_notifier.py), one job per tracker.
  # Rides the external cron: each dispatch polls presence for ~4.5 min, right up to the next tick.
  # Not part of the tracker matrix, so a failure here never affects the embeds above.
  # ---------------------------------------------------------------------------
  notify:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.notify != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read     # to fetch the previous run's state artifact
      contents: read
    concurrency:
      group: notifier-${{ matrix.id }}-${{ github.ref }}   # per ref: a test run on a branch never queues behind or cancels a live tick
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.notify) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Load previous notifier state
        if: ${{ inputs.notifier_mode != 'test' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: notifier-state-${{ matrix.id }}
        run: |
          mkdir -p state
          ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=1" \
                 --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -n "$ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > state.zip \
              && unzip -o -q state.zip -d state \
              || echo "::warning::could not load previous state; people already in The Hunt won't be announced"
          else
            echo "No previous state (first run): current Hunt players will be recorded silently"
          fi

      - name: Watch ${{ matrix.id }} joining The Hunt
        env:
          MODE: ${{ inputs.notifier_mode }}
          NOTIFIER: ${{ matrix.id }}
          WEBHOOK: ${{ secrets[matrix.webhookSecret] }}
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          ROBLOSECURITY_1: ${{ secrets.ROBLOSECURITY_1 }}
          ROBLOSECURITY_2: ${{ secrets.ROBLOSECURITY_2 }}
          ROBLOSECURITY_3: ${{ secrets.ROBLOSECURITY_3 }}
          ROBLOSECURITY_4: ${{ secrets.ROBLOSECURITY_4 }}
          ROBLOSECURITY_5: ${{ secrets.ROBLOSECURITY_5 }}
        run: |
          ARGS=()
          case "$MODE" in
            test)    ARGS+=(--test) ;;
            dry-run) ARGS+=(--dry-run --duration 200) ;;
          esac
          python join_notifier.py --notifier "$NOTIFIER" "${ARGS[@]}"

      - name: Save notifier state
        # dry-run/test must not write state: a dry-run "announces" to stdout and would consume a real join
        if: ${{ always() && inputs.notifier_mode == 'live' }}
        uses: actions/upload-artifact@v7
        with:
          name: notifier-state-${{ matrix.id }}
          path: state/notifier_${{ matrix.id }}.json
          retention-days: 1
          if-no-files-found: ignore
