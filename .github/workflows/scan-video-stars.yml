name: Video Star Scan

on:
  workflow_dispatch:
    inputs:
      max_members:
        description: 'Limit members for testing (leave empty for all)'
        required: false
        default: ''
      place_id:
        description: 'Target PlaceId'
        required: false
        default: '74205509034203'
      group_id:
        description: 'Group ID'
        required: false
        default: '4199740'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: video-star-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests tqdm
          python --version

      - name: Run shard ${{ matrix.shard }}/3
        run: |
          echo "Running Video Star shard ${{ matrix.shard }} of 3 (Group 4199740)"
          MAX_ARGS=""
          if [ -n "${{ inputs.max_members }}" ]; then
            MAX_ARGS="--max-members ${{ inputs.max_members }}"
          fi
          python roblox_group_scanner.py \
            --group-id "${{ inputs.group_id || '4199740' }}" \
            --place-id "${{ inputs.place_id || '74205509034203' }}" \
            --shard ${{ matrix.shard }} --shards 3 \
            $MAX_ARGS \
            --json shard_${{ matrix.shard }}.json \
            --verbose
          ls -lh shard_${{ matrix.shard }}.json
          cat shard_${{ matrix.shard }}.json | head -c 1000

      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: shard-video-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  merge:
    needs: scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: shard-video-*
          merge-multiple: true
          path: shards

      - name: Debug shards
        run: |
          ls -R | head -n 100
          ls -lh shards/ || echo "shards/ not found"
          find . -name "shard_*.json" | head -n 20

      - name: Merge shards
        run: |
          SHARDS=$(find shards . -name "shard_*.json" 2>/dev/null | tr '\n' ' ')
          echo "Found shards: $SHARDS"
          if [ -z "$SHARDS" ]; then
            echo "ERROR: No shard files found!"
            find . -type f -name "*.json" | head -n 20
            exit 1
          fi
          python merge_shards.py $SHARDS --json roblox_scan_results_video.json --csv roblox_scan_results_video.csv
          ls -lh roblox_scan_results_video.*
          python -m json.tool roblox_scan_results_video.json | head -n 150

      - name: Upload final results
        uses: actions/upload-artifact@v4
        with:
          name: final-results-video
          path: |
            roblox_scan_results_video.json
            roblox_scan_results_video.csv
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## Video Star Scan Complete" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          d=json.load(open('roblox_scan_results_video.json'))
          print(f\"**Group:** {d['meta']['groupId']} | **Target:** {d['meta']['targetGameName']} ({d['meta']['targetPlaceId']})\")
          print(f\"**Total members:** {d['summary']['total_members']}\")
          print(f\"**Target game:** {d['summary']['target_game_count']}\")
          print(f\"**Other games:** {d['summary']['other_game_count']}\")
          " >> $GITHUB_STEP_SUMMARY

      - name: Restore Discord message ID
        uses: actions/cache@v4
        with:
          path: discord_message_id_video_stars.txt
          key: discord-message-id-video-stars
          restore-keys: |
            discord-message-id-video-stars

      - name: Discord webhook (Video Star Tracker)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_VIDEO_STARS }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK_VIDEO_STARS secret set - skipping"
            exit 0
          fi
          if [ -f .github/discord_message_id_video_stars.txt ]; then
            echo "Restoring from repo .github/discord_message_id_video_stars.txt"
            cp .github/discord_message_id_video_stars.txt discord_message_id_video_stars.txt
            echo "Using ID $(cat discord_message_id_video_stars.txt)"
          elif [ -f discord_message_id_video_stars.txt ]; then
            echo "Using cached ID $(cat discord_message_id_video_stars.txt)"
          else
            echo "No existing message ID — will create new message"
          fi
          echo "Video Star Tracker - editing same embed every 5 min (#F9E999)"
          python discord_updater.py roblox_scan_results_video.json --webhook "$DISCORD_WEBHOOK" --message-id-file discord_message_id_video_stars.txt --title "Video Star Tracker" --color "#F9E999" --emoji "<:verified:1551329029783691334>" 2>&1 | head -n 100
          echo "--- Embed preview ---"
          python discord_updater.py roblox_scan_results_video.json --title "Video Star Tracker" --color "#F9E999" --emoji "<:verified:1551329029783691334>" --dry-run | head -n 80

      - name: Save Discord message ID to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: discord_message_id_video_stars.txt
          key: discord-message-id-video-stars-${{ hashFiles('discord_message_id_video_stars.txt') }}
        continue-on-error: true

      - name: Persist Discord message ID to repo
        if: always()
        run: |
          if [ -f discord_message_id_video_stars.txt ]; then
            mkdir -p .github
            cp discord_message_id_video_stars.txt .github/discord_message_id_video_stars.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/discord_message_id_video_stars.txt || true
            git diff --staged --quiet || git commit -m "chore: update video stars message id [skip ci]" || true
            git push origin HEAD:main || echo "Push failed - cache will handle it"
          fi
        continue-on-error: true
