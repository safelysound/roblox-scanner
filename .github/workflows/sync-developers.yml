name: Sync Developer IDs

# Periodically discovers new Developer+ members across configured Roblox communities
# (`groupSources` in config/trackers.yaml: Roblox Presents 4111519, Twin Atlas Events 33163515,
# Twin Atlas 15556721) across 8 parallel runner IPs and commits any additions to
# config/developer_ids.txt — automatically triggering Trackers to scan, update embeds, and follow.

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sync-developers-workflow
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Ensure Python dependencies
        run: python3 -c "import requests, yaml" 2>/dev/null || pip3 install --quiet --break-system-packages -r requirements.txt

      - name: Collect seed candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          ROBLOSECURITY_1: ${{ secrets.ROBLOSECURITY_1 }}
          ROBLOSECURITY_2: ${{ secrets.ROBLOSECURITY_2 }}
          ROBLOSECURITY_3: ${{ secrets.ROBLOSECURITY_3 }}
          ROBLOSECURITY_4: ${{ secrets.ROBLOSECURITY_4 }}
          ROBLOSECURITY_5: ${{ secrets.ROBLOSECURITY_5 }}
        run: python3 sync_developer_ids.py collect --tracker developers --ids-file config/developer_ids.txt --out collect.json

      - uses: actions/upload-artifact@v7
        with:
          name: sync-collect
          path: collect.json
          retention-days: 1

  sweep:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - name: Ensure Python dependencies
        run: python3 -c "import requests, yaml" 2>/dev/null || pip3 install --quiet --break-system-packages -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: sync-collect
          path: .

      - name: Sweep shard ${{ matrix.shard }}/8
        run: |
          python3 sync_developer_ids.py shard \
            --collect-json collect.json \
            --shard "${{ matrix.shard }}" \
            --shards 8 \
            --out "sync_shard_${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: sync-shard-${{ matrix.shard }}
          path: sync_shard_${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: [collect, sweep]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure Python dependencies
        run: python3 -c "import requests, yaml" 2>/dev/null || pip3 install --quiet --break-system-packages -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: sync-collect
          path: .

      - uses: actions/download-artifact@v8
        with:
          pattern: sync-shard-*
          merge-multiple: true
          path: sync_shards

      - name: Merge shards, run Wave-2 closure & update config/developer_ids.txt
        run: |
          git fetch origin main && git checkout -B main origin/main
          python3 sync_developer_ids.py merge \
            --collect-json collect.json \
            --shards-dir sync_shards \
            --ids-file config/developer_ids.txt \
            --report-json sync_report.json

      - uses: actions/upload-artifact@v7
        with:
          name: sync-developer-report
          path: |
            sync_report.json
            config/developer_ids.txt
          retention-days: 3

      - name: Commit and push updated developer_ids.txt
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp config/developer_ids.txt /tmp/synced_developer_ids.txt
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git checkout -B main origin/main || { sleep $((attempt * 2)); continue; }
            python3 sync_developer_ids.py union --ids-file config/developer_ids.txt --from-file /tmp/synced_developer_ids.txt
            git add config/developer_ids.txt
            if git diff --staged --quiet; then
              echo "No new Developer IDs to push"
              exit 0
            fi
            git commit -m "chore(developers): auto-sync Developer+ members to config/developer_ids.txt"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
