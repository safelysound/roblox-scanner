name: Enable Schedule
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-schedule.yml'
      - '.github/workflows/trackers.yml'
jobs:
  enable:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Enable trackers schedule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting to enable trackers workflow 364200727"
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/364200727/enable -w "HTTP %{http_code}\n"
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/364265428/enable -w "HTTP %{http_code}\n"
          echo "Done"
          # Also try to trigger a workflow_dispatch via API using GH_TOKEN (should have actions:write)
          echo "Trying workflow_dispatch for trackers"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/trackers.yml/dispatches -d '{"ref":"main","inputs":{"tracker":"all"}}' -w "HTTP %{http_code}\n" | head -c 500
