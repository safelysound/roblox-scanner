name: "Follow (residential - home IP)"

on:
  workflow_dispatch:
    inputs:
      tracker:
        description: 'Which to follow (developers, video-stars, admin, all)'
        required: false
        default: 'developers'
        type: choice
        options: ['developers', 'video-stars', 'admin', 'all']
      dry_run:
        description: 'Dry run (check without following)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      pool:
        description: 'Cookie pool size (1 = main alt only, 6 = all 6 alts shard 6x faster)'
        required: false
        default: '1'
        type: choice
        options: ['1', '6']

permissions:
  contents: read

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 720  # all (3491) needs ~2h with pool 6, ~11h with pool 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pyyaml

      - name: Dry run check
        if: ${{ inputs.dry_run == 'true' }}
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          ROBLOSECURITY_1: ${{ secrets.ROBLOSECURITY_1 }}
          ROBLOSECURITY_2: ${{ secrets.ROBLOSECURITY_2 }}
          ROBLOSECURITY_3: ${{ secrets.ROBLOSECURITY_3 }}
          ROBLOSECURITY_4: ${{ secrets.ROBLOSECURITY_4 }}
          ROBLOSECURITY_5: ${{ secrets.ROBLOSECURITY_5 }}
        run: |
          echo "Dry run for ${{ inputs.tracker }} (pool ${{ inputs.pool }})"
          python follow.py --tracker ${{ inputs.tracker }} --dry-run --pool ${{ inputs.pool }} 2>&1 | head -n 100
          echo "--- trackers.yaml ---"
          cat config/trackers.yaml

      - name: Follow (residential IP required - will 403 Challenge on datacenter)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          ROBLOSECURITY_1: ${{ secrets.ROBLOSECURITY_1 }}
          ROBLOSECURITY_2: ${{ secrets.ROBLOSECURITY_2 }}
          ROBLOSECURITY_3: ${{ secrets.ROBLOSECURITY_3 }}
          ROBLOSECURITY_4: ${{ secrets.ROBLOSECURITY_4 }}
          ROBLOSECURITY_5: ${{ secrets.ROBLOSECURITY_5 }}
        run: |
          echo "Following ${{ inputs.tracker }} with pool ${{ inputs.pool }} - NOTE: must run from home IP or self-hosted residential runner"
          echo "Datacenter (GitHub cloud) will 403 Challenge and fail - that is expected."
          echo "Home run: python follow.py --tracker ${{ inputs.tracker }} --pool ${{ inputs.pool }}"
          python follow.py --tracker ${{ inputs.tracker }} --pool ${{ inputs.pool }} 2>&1 | tail -n 200

      - name: Done
        if: always()
        run: echo "Check logs: 'OK' / 'already'. Next 5-min trackers.yml tick will show Hunt."

      - name: Ping Discord on finish/fail
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_PING_WEBHOOK }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_PING_WEBHOOK not set - skipping"
            exit 0
          fi
          RUN_URL="https://github.com/safelysound/roblox-scanner/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = "success" ]; then EMOJI="✅"; MSG="Follow ${{ inputs.tracker }} finished SUCCESS"
          else EMOJI="❌"; MSG="Follow ${{ inputs.tracker }} finished $STATUS"; fi
          CONTENT="<@475392041174564886> $EMOJI $MSG — [Run #${{ github.run_number }}]($RUN_URL)"
          PAYLOAD=$(jq -n --arg c "$CONTENT" '{content: $c, allowed_mentions: {parse: ["users"]}}')
          curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK" -o /tmp/out.txt -w "%{http_code}"; echo ""; cat /tmp/out.txt
