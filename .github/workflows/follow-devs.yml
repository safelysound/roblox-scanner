name: "Follow Devs (one-time)"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (check without following)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Dry run check
        if: ${{ inputs.dry_run == 'true' }}
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          ROBLOSECURITY_1: ${{ secrets.ROBLOSECURITY_1 }}
        run: |
          echo "Dry run - checking cookie & IDs, not following"
          echo "IDs in file: $(grep -c '^[0-9]' config/developer_ids.txt)"
          cat config/developer_ids.txt | head -n 20
          python3 -c "import os; [print(f\"{k}: {'set ('+str(len(os.environ.get(k,'')))+')' if os.environ.get(k,'') else 'empty'}\") for k in ['ROBLOSECURITY','ROBLOX_COOKIE','ROBLOSECURITY_1']]"
          python3 -c "ids=[l.strip() for l in open('config/developer_ids.txt') if l.strip() and not l.strip().startswith('#')]; print(f\"IDs: {len(ids)}\")"

      - name: Follow all developer_ids.txt (102) with alt
        if: ${{ inputs.dry_run != 'true' }}
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          ROBLOSECURITY_1: ${{ secrets.ROBLOSECURITY_1 }}
        run: |
          echo "Following $(grep -c '^[0-9]' config/developer_ids.txt) IDs..."
          cat config/developer_ids.txt | head -n 20
          echo "---"
          python follow_all.py

      - name: Done
        if: always()
        run: echo "Check logs above - 'Follow X -> OK' or 'already following'. Next 5-min tracker tick will show Hunt for those 2."
