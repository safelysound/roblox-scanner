# Single source of truth — the workflow builds its job matrix from this file.
# Add a tracker here and the scheduled runs pick it up (for manual runs, also add its id to the
# `tracker` choice list in .github/workflows/trackers.yml).
#
# Fields:
#   id             short id, used for artifact names and --tracker
#   name           embed title (also selects the "nobody in-game" wording)
#   groupId        Roblox group to scan            \  at least one of
#   idsFile        file of user IDs, one per line  /  groupId / idsFile
#   extraIds       extra user IDs to include even if not in the group
#   shards         how many parallel scan jobs (default 1; use 3 for big groups)
#   color          embed color (hex)
#   emoji          emoji shown before each name
#   webhookSecret  name of the Actions secret holding the Discord webhook URL
#   resultsFile    merged scan output (consumed by the Discord + follow steps)
#   messageIdFile  committed file remembering which Discord message to edit
#   scanEvery      minutes between scans of this tracker (must be a multiple of 5, the tick interval;
#                  default: every tick). The standing embed just refreshes less often -- the notifier
#                  (real-time join alerts) and follow are unaffected, they always run every tick.
#   anyGame        true: track whatever game+server each member is currently in, instead of requiring
#                  settings.targetPlaceId specifically. Testing mode between events (there's no fixed
#                  game to test against when nothing's running) -- flip back to false/omit for the next
#                  real event. Also used by this tracker's notifier entry below (same tracker id).

trackers:
  - id: admin
    name: Admin Tracker
    groupId: 1200769
    shards: 3
    color: "#305778"
    emoji: "<:roblox:1551329066337050754>"
    webhookSecret: DISCORD_WEBHOOK
    resultsFile: roblox_scan_results.json
    messageIdFile: .github/discord_message_id.txt
    scanEvery: 15  # was every tick; this is by far the biggest single presence-load contributor (~2800 members)

  - id: video-stars
    name: Video Star Tracker
    groupId: 4199740
    extraIds: [1377033267]  # skpm_plz — also in Admin, mirrored here
    shards: 3
    color: "#F9E999"
    emoji: "<:verified:1551329029783691334>"
    webhookSecret: DISCORD_WEBHOOK_VIDEO_STARS
    resultsFile: roblox_scan_results_video.json
    messageIdFile: .github/discord_message_id_video_stars.txt
    scanEvery: 15

  - id: developers
    name: Developer Tracker
    idsFile: config/developer_ids.txt
    groupSources:
      - groupId: 4111519   # Roblox Presents (The Hollow creator) — Developer, Admin, Owner
        minRank: 200
      - groupId: 33163515  # Twin Atlas Events — Developer, Manager, Administrator, Director
        minRank: 252
      - groupId: 15556721  # Twin Atlas — Developer, Manager, Administrator, Director, Executive, Twin Atlas
        minRank: 250
    shards: 1  # single scan job syncs groupSources + scans full developer roster
    color: "#000000"
    emoji: "<:developer:1551388816324169838>"
    webhookSecret: DISCORD_WEBHOOK_DEVELOPERS
    resultsFile: roblox_scan_results_developers.json
    messageIdFile: .github/discord_message_id_developers.txt

# Real-time join notifiers (join_notifier.py). One per tracker; the key is the tracker id.
#   title          embed title ({game} resolves to target game name or current game in anyGame mode)
#   color          embed color (hex)
#   roleId         role to ping (omit for no ping)
#   emoji          emoji before the name
#   webhookSecret  Actions secret holding this notifier's Discord webhook URL
#   interval       seconds between presence sweeps (big groups take a while per sweep)
#   thumbnail      avatar (default) or none
notifiers:
  developers:
    tracker: developers
    title: "A Developer has joined {game}!"
    color: "#000000"
    roleId: "1552512715443146805"
    emoji: "<:roblox:1551329066337050754>"
    webhookSecret: DISCORD_WEBHOOK_DEVELOPER_JOINS
    shards: 2
    interval: 5

  admin:
    tracker: admin
    title: "An Admin has joined {game}!"
    color: "#E74C3C"
    roleId: "1552548764021956748"
    emoji: "<:roblox:1551329066337050754>"
    webhookSecret: DISCORD_WEBHOOK_ADMIN_JOINS
    shards: 6
    interval: 11

  video-stars:
    tracker: video-stars
    title: "A Video Star has joined {game}!"
    color: "#F1C40F"
    roleId: "1552548815268221009"
    emoji: "<:verified:1551329029783691334>"
    webhookSecret: DISCORD_WEBHOOK_VIDEO_STAR_JOINS
    shards: 3
    interval: 6

settings:
  targetPlaceId: 116463962153167
  targetUniverseId: 10770728771
  # Set to true between events to stop all automatic activity (scan, notify, follow) with zero code
  # changes -- flip back to false when the next event starts. Only affects the automatic cron dispatch
  # (tracker: all/unset); a manual dispatch for one specific tracker always runs, so testing and prep
  # work between events is unaffected.
  paused: false
