# Single source of truth — the workflow builds its job matrix from this file.
# Add a tracker here and the scheduled runs pick it up (for manual runs, also add its id to the
# `tracker` choice list in .github/workflows/trackers.yml).
#
# Fields:
#   id             short id, used for artifact names and --tracker
#   name           embed title (also selects the "nobody in-game" wording)
#   groupId        Roblox group to scan            \  at least one of
#   idsFile        file of user IDs, one per line  /  groupId / idsFile
#   extraIds       extra user IDs to include even if not in the group
#   shards         how many parallel scan jobs (default 1; use 3 for big groups)
#   color          embed color (hex)
#   emoji          emoji shown before each name
#   webhookSecret  name of the Actions secret holding the Discord webhook URL
#   resultsFile    merged scan output (consumed by the Discord + follow steps)
#   messageIdFile  committed file remembering which Discord message to edit

trackers:
  - id: admin
    name: Admin Tracker
    groupId: 1200769
    shards: 3
    color: "#305778"
    emoji: "<:roblox:1551329066337050754>"
    webhookSecret: DISCORD_WEBHOOK
    resultsFile: roblox_scan_results.json
    messageIdFile: .github/discord_message_id.txt

  - id: video-stars
    name: Video Star Tracker
    groupId: 4199740
    extraIds: [1377033267]  # skpm_plz — also in Admin, mirrored here
    shards: 3
    color: "#F9E999"
    emoji: "<:verified:1551329029783691334>"
    webhookSecret: DISCORD_WEBHOOK_VIDEO_STARS
    resultsFile: roblox_scan_results_video.json
    messageIdFile: .github/discord_message_id_video_stars.txt

  - id: developers
    name: Developer Tracker
    idsFile: config/developer_ids.txt
    shards: 1  # small list (~100 IDs): one job is faster than three
    color: "#000000"
    emoji: "<:developer:1551388816324169838>"
    webhookSecret: DISCORD_WEBHOOK_DEVELOPERS
    resultsFile: roblox_scan_results_developers.json
    messageIdFile: .github/discord_message_id_developers.txt

# Real-time "joined The Hunt" notifiers (join_notifier.py). One per tracker; the key is the tracker id.
#   title          embed title
#   color          embed color (hex)
#   roleId         role to ping (omit for no ping)
#   emoji          emoji before the name
#   webhookSecret  Actions secret holding this notifier's Discord webhook URL
#   interval       seconds between presence sweeps (big groups take a while per sweep)
#   thumbnail      avatar (default) or none
notifiers:
  developers:
    tracker: developers
    title: "A Developer has joined The Hunt: Roblox 20!"
    color: "#000000"
    roleId: "1552512715443146805"
    emoji: "<:roblox:1551329066337050754>"
    webhookSecret: DISCORD_WEBHOOK_DEVELOPER_JOINS
    interval: 12

  admin:
    tracker: admin
    title: "An Admin has joined The Hunt: Roblox 20!"
    color: "#E74C3C"
    roleId: "1552548764021956748"
    emoji: "<:roblox:1551329066337050754>"
    webhookSecret: DISCORD_WEBHOOK_ADMIN_JOINS
    interval: 60

  video-stars:
    tracker: video-stars
    title: "A Video Star has joined The Hunt: Roblox 20!"
    color: "#F1C40F"
    roleId: "1552548815268221009"
    emoji: "<:verified:1551329029783691334>"
    webhookSecret: DISCORD_WEBHOOK_VIDEO_STAR_JOINS
    interval: 20

settings:
  targetPlaceId: 74205509034203
  targetUniverseId: 10766456501
